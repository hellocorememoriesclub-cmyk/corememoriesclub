<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We're Upgrading | Core Memories Club</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#1e1145;
    --bg-darker:#150b30;
    --brand-gradient:linear-gradient(135deg,#7c3aed 0%,#ec4899 55%,#14b8a6 100%);
    --text-light:#ffffff;
    --text-muted:#c9beee;
    --text-muted-2:#8c8299;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:radial-gradient(circle at 20% 20%, #2a1a5e 0%, var(--bg-darker) 60%);
    color:var(--text-light);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
    overflow:hidden;
  }
  .wrap{max-width:560px;position:relative;z-index:1}
  .logo{
    font-size:15px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--brand-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:28px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:24px;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#ec4899;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h1{
    font-size:clamp(32px,6vw,52px);
    font-weight:800;
    line-height:1.15;
    margin-bottom:18px;
  }
  h1 span{
    background:var(--brand-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.lead{
    font-size:16.5px;
    color:var(--text-muted);
    line-height:1.7;
    max-width:460px;
    margin:0 auto 36px;
  }
  .contact{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
  }
  .contact a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 22px;
    border-radius:999px;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    color:#fff;
  }
  .contact a.primary{background:var(--brand-gradient);box-shadow:0 8px 24px rgba(236,72,153,.35)}
  .contact a.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text-muted)}
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
    z-index:0;
  }
  .orb1{width:380px;height:380px;background:#7c3aed;top:-180px;left:-160px}
  .orb2{width:320px;height:320px;background:#14b8a6;bottom:-160px;right:-140px}
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="wrap">
    <div class="logo">Core Memories Club</div>
    <div class="badge"><span class="dot"></span> We'll be back shortly</div>
    <h1>Making your next<br><span>trip even better</span></h1>
    <p class="lead">Our website is currently getting an upgrade. We're putting the finishing touches on something great — check back soon.</p>
    <div class="contact">
      <a class="primary" href="tel:+918826526252">📞 +91 88265 26252</a>
      <a class="secondary" href="mailto:hello@corememoriesclub.com">✉️ hello@corememoriesclub.com</a>
    </div>
  </div>
</body>
</html>
