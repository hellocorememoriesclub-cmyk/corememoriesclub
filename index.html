<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance | Core Memories Club</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/favicon.ico">
<style>
  :root{
    --accent:#0071e3;
    --text-light:#ffffff;
    --text-muted:#a1a1a6;
    --text-muted-2:#86868b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;
    background:#000;
    color:var(--text-light);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
    letter-spacing:-.01em;
  }
  .wrap{max-width:560px;position:relative;z-index:1}
  .logo{
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--text-muted);
    margin-bottom:28px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    border-radius:980px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:24px;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h1{
    font-size:clamp(32px,6vw,52px);
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.1;
    margin-bottom:18px;
  }
  h1 span{color:var(--accent)}
  p.lead{
    font-size:16.5px;
    font-weight:400;
    color:var(--text-muted);
    line-height:1.6;
    max-width:460px;
    margin:0 auto 36px;
  }
  .contact{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
  }
  .contact a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 22px;
    border-radius:980px;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    color:#fff;
    transition:background .2s ease;
  }
  .contact a.primary{background:var(--accent)}
  .contact a.primary:hover{background:#0077ed}
  .contact a.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text-muted)}
  .contact a.secondary:hover{background:rgba(255,255,255,.14)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">CORE MEMORIES CLUB</div>
    <div class="badge"><span class="dot"></span> Under Maintenance</div>
    <h1>We're doing some<br><span>quick housekeeping</span></h1>
    <p class="lead">Our website is briefly down for maintenance. We'll be back online shortly — thanks for your patience.</p>
    <div class="contact">
      <a class="primary" href="tel:+918826526252">📞 +91 88265 26252</a>
      <a class="secondary" href="mailto:hello@corememoriesclub.com">✉️ hello@corememoriesclub.com</a>
    </div>
  </div>
</body>
</html>
